<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<defs>
  <radialGradient id="bg" cx="0.45" cy="0.08" r="1.1">
    <stop offset="0" stop-color="#2f93a8"/><stop offset=".4" stop-color="#12506a"/><stop offset=".78" stop-color="#082c40"/><stop offset="1" stop-color="#031521"/>
  </radialGradient>
  <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4f4012"/><stop offset=".16" stop-color="#7d6217"/><stop offset=".36" stop-color="#b08c24"/><stop offset=".56" stop-color="#d3ac38"/><stop offset=".74" stop-color="#e5cd84"/><stop offset=".88" stop-color="#f0e8cf"/><stop offset="1" stop-color="#faf6e8"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fe3d2" stop-opacity=".0"/><stop offset=".25" stop-color="#9fe3d2" stop-opacity=".28"/><stop offset=".7" stop-color="#9fe3d2" stop-opacity=".12"/><stop offset="1" stop-color="#9fe3d2" stop-opacity="0"/></linearGradient>
  <linearGradient id="finG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e5516" stop-opacity=".95"/><stop offset="1" stop-color="#cfa62e" stop-opacity=".78"/></linearGradient>
  <linearGradient id="lowFin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9b94a" stop-opacity=".95"/><stop offset="1" stop-color="#f4eed8" stop-opacity=".9"/></linearGradient>
  <linearGradient id="tailG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a98524"/><stop offset="1" stop-color="#6a5316"/></linearGradient>
  <radialGradient id="eyeG" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#f4f7ee"/><stop offset=".55" stop-color="#cfd9c6"/><stop offset="1" stop-color="#8d9f86"/></radialGradient>
  <radialGradient id="gloss" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="drop" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".5"/></filter>
  <pattern id="scales" width="20" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(6)">
    <path d="M0 16 Q10 3 20 16" fill="none" stroke="#2e2408" stroke-opacity=".28" stroke-width="1.6"/>
    <path d="M-10 8 Q0 -5 10 8" fill="none" stroke="#2e2408" stroke-opacity=".22" stroke-width="1.4"/>
    <path d="M10 8 Q20 -5 30 8" fill="none" stroke="#2e2408" stroke-opacity=".22" stroke-width="1.4"/>
  </pattern>
  <path id="bp" d="M2 108 C24 84 62 62 110 48 C160 34 210 30 270 30 C400 26 520 42 640 80 L700 86 L790 22 L756 104 L790 188 L700 122 L640 126 C520 168 380 182 250 176 C170 172 90 160 50 138 C28 128 12 120 2 108Z"/>
  <clipPath id="bodyClip"><use href="#bp"/></clipPath>
  <path id="cord" pathLength="100" d="M330 -30 C330 220 176 280 150 492"/>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>
<g>
  <polygon points="250,0 380,0 560,1024 330,1024" fill="url(#ray)" opacity=".5"/>
  <polygon points="480,0 560,0 860,1024 680,1024" fill="url(#ray)" opacity=".35"/>
  <polygon points="620,0 700,0 1024,880 1024,1024 900,1024" fill="url(#ray)" opacity=".25"/>
</g>
<!-- BUBBLES -->
<g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3">
  <circle cx="850" cy="250" r="14"/><circle cx="800" cy="170" r="8"/><circle cx="880" cy="140" r="5"/><circle cx="740" cy="330" r="6"/>
</g>
<!-- CORD -->
<g>
  <use href="#cord" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="28" filter="url(#blur5)" transform="translate(8 9)"/>
  <g fill="none" stroke-width="22">
    <use href="#cord" stroke="#A6192E" stroke-dasharray="10 40" stroke-dashoffset="0"/>
    <use href="#cord" stroke="#EFE1C6" stroke-dasharray="10 40" stroke-dashoffset="-10"/>
    <use href="#cord" stroke="#EAAA00" stroke-dasharray="10 40" stroke-dashoffset="-20"/>
    <use href="#cord" stroke="#1d7a52" stroke-dasharray="10 40" stroke-dashoffset="-30"/>
    <use href="#cord" stroke="#8a1226" stroke-dasharray="10 40" stroke-dashoffset="-40"/>
  </g>
  <use href="#cord" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="22" stroke-dasharray="1.6 4.8"/>
  <use href="#cord" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="4" transform="translate(-6 0)"/>
  <use href="#cord" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="4" transform="translate(7 0)"/>
</g>

<!-- WALLEYE -->
<g transform="translate(92 436) rotate(-4 400 100) scale(1.07)">
  <ellipse cx="400" cy="226" rx="330" ry="26" fill="#000" opacity=".35" filter="url(#soft)"/>
  <g filter="url(#drop)">
    <!-- tail -->
    <path d="M640 80 L700 86 L790 22 L756 104 L790 188 L700 122 L640 126Z" fill="url(#tailG)" stroke="#3a2c08" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#2e2408" stroke-opacity=".55" stroke-width="2.4" fill="none"><path d="M700 88 L784 28M700 94 L772 58M700 100 L758 90M700 106 L772 146M700 116 L784 182"/></g>
    <g fill="#2e2408" opacity=".35" filter="url(#blur2)"><ellipse cx="736" cy="70" rx="18" ry="9" transform="rotate(-30 736 70)"/><ellipse cx="740" cy="140" rx="18" ry="9" transform="rotate(30 740 140)"/></g>
    <path d="M776 154 L790 188 L742 136Z" fill="#fff" opacity=".96"/>
    <!-- fins behind body -->
    <g stroke="#3a2c08" stroke-width="3" stroke-linejoin="round">
      <path d="M236 34 L252 -46 L284 8 L316 -60 L348 6 L382 -44 L410 12 L436 -8 L446 40Z" fill="url(#finG)"/>
      <path d="M476 44 C490 -4 560 -8 604 70Z" fill="url(#finG)"/>
      <path d="M268 170 L296 240 L352 170Z" fill="url(#lowFin)"/>
      <path d="M544 152 L574 216 L636 130Z" fill="url(#lowFin)"/>
    </g>
    <g stroke="#2e2408" stroke-opacity=".6" stroke-width="2.4" fill="none">
      <path d="M254 32 L254 -40M288 30 L314 -54M320 30 L346 6M352 30 L380 -36M386 30 L408 12M414 32 L434 -4"/>
      <path d="M494 42 C504 10 544 4 568 38M516 46 L550 14M540 54 L576 36"/>
    </g>
    <g fill="#16110a" opacity=".55"><circle cx="268" cy="-12" r="4"/><circle cx="300" cy="-26" r="4"/><circle cx="332" cy="-22" r="4"/><circle cx="364" cy="-10" r="4"/><circle cx="398" cy="2" r="4"/><circle cx="510" cy="20" r="3.5"/><circle cx="540" cy="14" r="3.5"/><circle cx="566" cy="34" r="3.5"/></g>
    <!-- body -->
    <use href="#bp" fill="url(#bodyG)"/>
    <g clip-path="url(#bodyClip)">
      <use href="#bp" fill="url(#scales)"/>
      <g fill="#2a2008" opacity=".62" filter="url(#blur5)">
        <path d="M222 24 L282 24 L300 104 L246 110Z"/>
        <path d="M296 22 L360 22 L384 112 L322 118Z"/>
        <path d="M372 24 L440 28 L458 108 L398 116Z"/>
        <path d="M452 30 L520 40 L534 112 L478 118Z"/>
        <path d="M538 46 L600 64 L606 110 L558 114Z"/>
        <path d="M618 72 L650 80 L650 112 L622 112Z"/>
        <path d="M120 40 L190 30 L200 70 L130 80Z" opacity=".5"/>
      </g>
      <!-- flank sheen & back gloss -->
      <path d="M60 96 C240 82 480 92 700 100 L700 124 C480 120 240 124 60 120Z" fill="url(#sheen)"/>
      <ellipse cx="330" cy="46" rx="320" ry="30" fill="url(#gloss)" opacity=".6"/>
      <!-- lateral line -->
      <path d="M200 90 C320 80 500 90 640 98" fill="none" stroke="#2e2408" stroke-opacity=".5" stroke-width="2.6" stroke-dasharray="1 5" stroke-linecap="round"/>
      <path d="M0 150 C200 192 480 192 700 132 L700 230 L0 230Z" fill="#000" opacity=".07"/>
    </g>
    <use href="#bp" fill="none" stroke="#2a2008" stroke-opacity=".8" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- black blotch at the rear base of the spiny dorsal -->
    <ellipse cx="426" cy="30" rx="26" ry="14" fill="#0f0b04" opacity=".7" filter="url(#blur2)"/>
    <!-- pelvic/pectoral -->
    <path d="M222 124 C258 128 300 144 322 172 C286 172 244 160 222 124Z" fill="url(#lowFin)" stroke="#3a2c08" stroke-width="2.5"/>
    <!-- opercle -->
    <path d="M190 52 C160 84 160 128 194 164" fill="none" stroke="#2a2008" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <path d="M200 58 C178 90 180 126 204 154" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="196" cy="92" rx="5" ry="9" fill="#16110a" opacity=".45"/>
    <!-- mouth: long jaw reaching under the eye, with a hint of teeth -->
    <path d="M2 108 C44 118 88 122 130 118" fill="none" stroke="#1d1507" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M30 112 L33 119M44 115 L47 122M58 117 L61 124M72 119 L75 126" stroke="#f4efe0" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
    <!-- eye -->
    <circle cx="106" cy="82" r="30" fill="#1b1407"/>
    <circle cx="106" cy="82" r="26" fill="url(#eyeG)"/>
    <circle cx="108" cy="83" r="14" fill="#06100b"/>
    <ellipse cx="98" cy="74" rx="6" ry="4.5" fill="#fff" opacity=".9" transform="rotate(-30 98 74)"/>
  </g>
</g>
<!-- crimp + steel leader -->
<path d="M152 520 C150 540 130 556 110 568" fill="none" stroke="#1b2124" stroke-width="6" stroke-linecap="round" opacity=".45" transform="translate(2 3)"/>
<path d="M152 520 C150 540 130 556 110 568" fill="none" stroke="#dfe7ea" stroke-width="3.6" stroke-linecap="round"/>
<g transform="translate(150 492) rotate(8)"><rect x="-10" y="-3" width="20" height="30" rx="7" fill="#9aa7ad"/><rect x="-10" y="-3" width="20" height="30" rx="7" fill="none" stroke="#3a4448" stroke-width="2"/><rect x="-6.5" y="-1" width="6" height="26" rx="3" fill="#fff" opacity=".7"/><path d="M-10 8H10M-10 15H10" stroke="#3a4448" stroke-opacity=".5" stroke-width="1.6"/></g>
</svg>
