<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#082c40" />
    <link rel="icon" href="favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Leadcore Calculator</title>
    <script>
      // Apply a saved light/dark choice before first paint so the page doesn't flash the wrong theme.
      try {
        var t = JSON.parse(localStorage.getItem("lc.settings")).theme;
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
